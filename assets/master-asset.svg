<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="masterTitle masterDesc">
  <title id="masterTitle">Expense Tracker Pro</title>
  <desc id="masterDesc">A weathered teal tile holding a cream wallet with an aged leather pocket, an Indian rupee symbol and a brass coin.</desc>
  <defs>
    <linearGradient id="tile" x1="56" y1="32" x2="456" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#258E8E"/>
      <stop offset=".52" stop-color="#1D7373"/>
      <stop offset="1" stop-color="#145757"/>
    </linearGradient>
    <linearGradient id="paperWallet" x1="104" y1="128" x2="392" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFAF0"/>
      <stop offset="1" stop-color="#F0E1C6"/>
    </linearGradient>
    <linearGradient id="brass" x1="360" y1="58" x2="452" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C078"/>
      <stop offset="1" stop-color="#A6612F"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="36%" r="74%">
      <stop offset=".5" stop-color="#06302F" stop-opacity="0"/>
      <stop offset="1" stop-color="#06302F" stop-opacity=".34"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- weathered paper grain over the teal -->
  <g clip-path="url(#tileClip)">
    <g fill="#FDF5E6" opacity=".055">
      <ellipse cx="118" cy="96" rx="130" ry="74"/>
      <ellipse cx="420" cy="398" rx="146" ry="88"/>
      <ellipse cx="256" cy="470" rx="190" ry="54"/>
    </g>
    <g stroke="#FDF5E6" stroke-opacity=".05" stroke-width="3" stroke-linecap="round">
      <path d="M26 74h168M300 52h150M34 444h120M250 492h210M22 236h58M452 214h42"/>
    </g>
    <g stroke="#06302F" stroke-opacity=".07" stroke-width="3" stroke-linecap="round">
      <path d="M62 160h110M330 136h128M70 352h66M372 462h88"/>
    </g>
    <rect width="512" height="512" fill="url(#vignette)"/>
  </g>

  <!-- brass coin -->
  <circle cx="405" cy="104" r="54" fill="url(#brass)"/>
  <circle cx="405" cy="104" r="54" fill="none" stroke="#6F3F1C" stroke-opacity=".45" stroke-width="6"/>
  <circle cx="405" cy="104" r="36" fill="none" stroke="#FDF5E6" stroke-opacity=".4" stroke-width="5"/>

  <!-- wallet body -->
  <path d="M92 182c0-28.7 23.3-52 52-52h202c28.7 0 52 23.3 52 52v148c0 28.7-23.3 52-52 52H144c-28.7 0-52-23.3-52-52V182Z" fill="url(#paperWallet)"/>

  <!-- aged leather pocket -->
  <path d="M92 208h254c25.4 0 46 20.6 46 46v71H287c-27.1 0-49-21.9-49-49s21.9-49 49-49h105" fill="#E3CDA4"/>
  <path d="M92 208h254c25.4 0 46 20.6 46 46v71H287c-27.1 0-49-21.9-49-49s21.9-49 49-49h105" fill="none" stroke="#A6612F" stroke-width="18" stroke-linejoin="round"/>
  <circle cx="316" cy="276" r="17" fill="#A6612F"/>

  <!-- stitched leather tab -->
  <path d="M166 190h86" stroke="#A6612F" stroke-width="18" stroke-linecap="round"/>

  <!-- indian rupee, inked -->
  <path d="M177 267h71M177 293h61M205 267c18 0 30 8 30 21 0 16-15 26-39 26h-19M205 314l40 44" fill="none" stroke="#2A2A2A" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
